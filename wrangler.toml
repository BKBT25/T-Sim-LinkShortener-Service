name = "t-sim-link-shortener"
main = "src/index.ts"
compatibility_date = "2026-01-01"
# Mantiene también un *.workers.dev de respaldo (útil para probar antes del DNS).
workers_dev = true

# Dominio propio para los enlaces cortos: https://go.t-sim.tlanextlilabs.com/s/<codigo>
# El dominio debe estar en la misma cuenta de Cloudflare (zona tlanextlilabs.com).
routes = [
  { pattern = "go.t-sim.tlanextlilabs.com", custom_domain = true }
]

[vars]
# Orígenes permitidos de la app (separados por comas). Solo se acortan enlaces
# de estos orígenes: así el Worker no se puede usar como redirección abierta.
APP_ORIGINS = "https://t-sim.tlanextlilabs.com,http://localhost:5173,http://127.0.0.1:5173"
# Vida del enlace corto: 30 días.
LINK_TTL_SECONDS = "2592000"
RATE_LIMIT_PER_MINUTE = "20"

# Crea el espacio de nombres antes de desplegar:
#   npx wrangler kv namespace create LINKS
# y pega aquí el id que devuelve.
[[kv_namespaces]]
binding = "LINKS"
id = "a4864a72e5d747fd9baa745579cd9b1a"
